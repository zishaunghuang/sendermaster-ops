# Place this log_format in the http block, outside server. Do not log setup tokens.
log_format ops_no_args '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
# Install only after DNS and certificate paths are confirmed.
limit_req_zone $binary_remote_addr zone=ops_auth:10m rate=10r/m;
server {
  listen 443 ssl;
  server_name ops.sendermaster.com;
  ssl_certificate /etc/letsencrypt/live/ops.sendermaster.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ops.sendermaster.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  access_log /var/log/nginx/sendermaster-ops-access.log ops_no_args;
  client_max_body_size 128k;
  location = /api/auth {
    limit_req zone=ops_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }
}
server { listen 80; server_name ops.sendermaster.com; return 301 https://$host$request_uri; }
